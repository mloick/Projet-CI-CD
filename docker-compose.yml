version: '3.8'

services:
  app:
    build: .
    container_name: calorie-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/calorie-tracker.db
      - LOG_LEVEL=info
    volumes:
      - calorie-data:/app/data
    networks:
      - calorie-network
    depends_on:
      - prometheus
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - calorie-network
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - calorie-network
    restart: always

networks:
  calorie-network:
    driver: bridge

volumes:
  calorie-data:
  grafana-storage:
