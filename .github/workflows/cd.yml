name: CD Pipeline

on:
  # Triggers only AFTER CI Pipeline completes — eliminates the race condition
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  # Manual production deploy or tag-based release
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only deploy staging when CI succeeded on main
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    environment: staging
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag image as :staging
        env:
          IMAGE_ID: ghcr.io/${{ github.repository }}
          # Use the SHA from the CI run, not the CD workflow SHA
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          docker pull "$IMAGE_ID:$BUILD_SHA"
          docker tag  "$IMAGE_ID:$BUILD_SHA" "$IMAGE_ID:staging"
          docker push "$IMAGE_ID:staging"
          echo "Deployed $IMAGE_ID:$BUILD_SHA → $IMAGE_ID:staging"

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag image as :latest and :<tag>
        env:
          IMAGE_ID: ghcr.io/${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          IMAGE_ID=$(echo "$IMAGE_ID" | tr '[:upper:]' '[:lower:]')
          docker pull "$IMAGE_ID:$BUILD_SHA"
          docker tag  "$IMAGE_ID:$BUILD_SHA" "$IMAGE_ID:latest"
          docker tag  "$IMAGE_ID:$BUILD_SHA" "$IMAGE_ID:${{ github.ref_name }}"
          docker push "$IMAGE_ID:latest"
          docker push "$IMAGE_ID:${{ github.ref_name }}"
          echo "Deployed $IMAGE_ID:$BUILD_SHA → latest + ${{ github.ref_name }}"
