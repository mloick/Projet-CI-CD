name: CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull, Retag and Push Staging
        run: |
          IMAGE_ID=ghcr.io/${GITHUB_REPOSITORY,,}
          # On attend que l'image soit disponible (buildée par le workflow CI)
          for i in {1..40}; do
            if docker pull $IMAGE_ID:${{ github.sha }}; then
              echo "Image successfully pulled!"
              break
            fi
            echo "Waiting for image to be built (attempt $i)..."
            sleep 15
            if [ $i -eq 40 ]; then
              echo "Timeout waiting for docker image."
              exit 1
            fi
          done
          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:staging
          docker push $IMAGE_ID:staging

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull, Retag and Push Production
        run: |
          IMAGE_ID=ghcr.io/${GITHUB_REPOSITORY,,}
          # On attend que l'image soit disponible (buildée par le workflow CI)
          for i in {1..40}; do
            if docker pull $IMAGE_ID:${{ github.sha }}; then
              echo "Image successfully pulled!"
              break
            fi
            echo "Waiting for image to be built (attempt $i)..."
            sleep 15
            if [ $i -eq 40 ]; then
              echo "Timeout waiting for docker image."
              exit 1
            fi
          done
          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:latest
          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:${{ github.ref_name }}
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.ref_name }}
